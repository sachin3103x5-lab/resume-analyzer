# Netlify Configuration for Frontend Deployment
[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

# SPA Routing: Redirect all client-side routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional API proxy: Redirect /api calls to the backend hosted on Render
# Replace with your actual Render service URL once deployed:
# [[redirects]]
#   from = "/api/*"
#   to = "https://ai-resume-analysier-api.onrender.com/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
